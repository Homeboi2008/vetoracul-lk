{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новый пароль — ВетОракул</title>
    <link rel="stylesheet" href="{% static 'css/style-reg.css' %}">
</head>
<body>
<div class="reg-page">
    <aside class="reg-branding">
        <div class="branding-content">
            <h1 class="branding-title">Новый пароль</h1>
        </div>
    </aside>
    <main class="reg-form-section reg-form-section--centered">
        <div class="reg-form-wrapper">
            <div class="reg-form-container">
                <div class="reg-form-header">
                    <h2 class="reg-form-title">Установите новый пароль</h2>
                </div>
                <form method="post" class="reg-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<p class="form-hint error">{{ field.errors }}</p>{% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-submit">
                        <span>Установить пароль</span>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

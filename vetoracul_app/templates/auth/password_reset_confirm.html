{% extends 'auth/base.html' %}
{% block title %}Установка нового пароля{% endblock %}
{% block content %}
<div class="auth-card">
    <h2 class="text-center">🔒 Новый пароль</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Установить пароль</button>
    </form>
</div>
{% endblock %}

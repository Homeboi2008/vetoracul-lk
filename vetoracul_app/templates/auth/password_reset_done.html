{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Письмо отправлено — ВетОракул</title>
    <link rel="stylesheet" href="{% static 'css/style-reg.css' %}">
</head>
<body>
    <div class="reg-page">
        <aside class="reg-branding">
            <div class="branding-content">
                <h1 class="branding-title">Проверьте почту</h1>
            </div>
        </aside>
        <main class="reg-form-section reg-form-section--centered">
            <div class="reg-form-wrapper">
                <div class="success-message">
                    <div class="success-icon">📧</div>
                    <h3 class="success-title">Письмо отправлено</h3>
                    <p class="success-text">Мы отправили ссылку для сброса пароля. Проверьте входящие и папку «Спам».</p>
                    <a href="{% url 'login' %}" class="btn btn-submit btn-rounded" style="text-decoration:none;margin-top:16px;display:inline-flex;">
                        <span>Вернуться ко входу</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

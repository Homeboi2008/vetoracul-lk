{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пароль изменён — ВетОракул</title>
    <link rel="stylesheet" href="{% static 'css/style-reg.css' %}">
</head>
<body>
    <div class="reg-page">
        <aside class="reg-branding">
            <div class="branding-content">
                <h1 class="branding-title">Готово!</h1>
            </div>
        </aside>
        <main class="reg-form-section reg-form-section--centered">
            <div class="reg-form-wrapper">
                <div class="success-message">
                    <div class="success-icon">✅</div>
                    <h3 class="success-title">Пароль успешно изменён</h3>
                    <p class="success-text">Теперь вы можете войти с новым паролем.</p>
                    <a href="{% url 'login' %}" class="btn btn-submit btn-rounded" style="text-decoration:none;display:inline-flex;">
                        <span>Войти</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>

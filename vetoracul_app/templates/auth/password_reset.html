{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сброс пароля — ВетОракул</title>
    <link rel="stylesheet" href="{% static 'css/style-reg.css' %}">
</head>
<body>
<div class="reg-page">
    <aside class="reg-branding">
        <div class="branding-content">
            <h1 class="branding-title">Сброс пароля</h1>
            <p class="branding-subtitle">Введите email, указанный при регистрации</p>
        </div>
    </aside>
    <main class="reg-form-section reg-form-section--centered">
        <div class="reg-form-wrapper">
            <div class="reg-form-container">
                <div class="reg-form-header">
                    <h2 class="reg-form-title">Сброс пароля</h2>
                    <p class="reg-form-subtitle">Мы отправим вам ссылку для сброса пароля</p>
                </div>
                <form method="post" class="reg-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<p class="form-hint error">{{ field.errors }}</p>{% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-submit">
                        <span>Отправить ссылку</span><span class="btn-arrow">→</span>
                    </button>
                    <div class="reg-form-footer">
                        <p><a href="{% url 'login' %}" class="login-link">← Вернуться ко входу</a></p>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

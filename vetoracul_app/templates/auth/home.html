{% extends 'auth/base.html' %}
{% block title %}Главная{% endblock %}
{% block content %}
<div class="text-center mt-5">
    <h1>🐾 Добро пожаловать в ВетКлинику!</h1>
    <p class="lead">Управляйте здоровьем своих питомцев легко и удобно.</p>
    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}" class="btn btn-primary btn-lg">Мой профиль</a>
    {% else %}
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Войти</a>
        <a href="{% url 'register' %}" class="btn btn-outline-secondary btn-lg">Зарегистрироваться</a>
    {% endif %}
</div>
{% endblock %}

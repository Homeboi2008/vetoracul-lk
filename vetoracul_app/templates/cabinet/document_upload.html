{% extends 'base.html' %}
{% block title %}Загрузка документа{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Загрузка документа</h1>
</div>

<div class="settings-card" style="max-width:600px;">
    <form method="post" enctype="multipart/form-data" class="pet-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="form-hint error">{{ field.errors }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="form-actions">
            <a href="{% url 'folder_list' %}" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Загрузить</button>
        </div>
    </form>
</div>
{% endblock %}

{% extends 'base_app.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ title }}</h1>
    <p class="page-subtitle">Питомец: {{ pet.name }}</p>
</div>

<div class="settings-card" style="max-width:700px;">
    <form method="post" enctype="multipart/form-data" class="pet-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="form-hint error">{{ field.errors }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="form-actions">
            <a href="{% url 'pet_detail' pet.pk %}" class="btn btn-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}

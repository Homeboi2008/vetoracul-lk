{% extends 'auth/base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card border-danger">
        <div class="card-body">
            <h3 class="card-title text-danger">Удалить питомца?</h3>
            <p>Вы уверены, что хотите удалить питомца <strong>{{ object.name }}</strong>? Все связанные диагнозы, документы и напоминания также будут удалены.</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'pet_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

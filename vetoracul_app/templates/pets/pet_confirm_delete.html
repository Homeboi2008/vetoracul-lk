{% extends 'base.html' %}
{% block title %}Удалить питомца{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Удалить питомца?</h1>
</div>

<div class="settings-card" style="max-width:500px;">
    <p>Вы уверены, что хотите удалить питомца <strong>{{ object.name }}</strong>?
       Все связанные диагнозы, документы и напоминания также будут удалены.</p>
    <form method="post" class="form-actions" style="border:none;padding-top:0;">
        {% csrf_token %}
        <a href="{% url 'pet_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-danger">Да, удалить</button>
    </form>
</div>
{% endblock %}

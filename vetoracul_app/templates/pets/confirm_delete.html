{% extends 'base.html' %}
{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Удалить {{ object_type }}?</h1>
</div>

<div class="settings-card" style="max-width:500px;">
    <p>Вы уверены, что хотите удалить: <strong>{{ object }}</strong>?</p>
    <form method="post" class="form-actions" style="border:none;padding-top:0;">
        {% csrf_token %}
        <a href="{{ cancel_url }}" class="btn btn-secondary">Отмена</a>
        <button type="submit" class="btn btn-danger">Да, удалить</button>
    </form>
</div>
{% endblock %}
